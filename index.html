<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0D0F0D" />
  <title>RuckOps</title>
  <meta name="description" content="GPS workout tracker for rucking and running. Built for ruckers." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="styles.css?v=20260511i" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app"><div class="boot">RUCKOPS · BOOTING…</div></div>

  <!-- Toast region -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Confirmation modal (always mounted; shown on demand) -->
  <div id="confirm-modal" class="modal-root hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <h3 class="modal-title" id="confirm-title">Confirm</h3>
      <p class="modal-message" id="confirm-message"></p>
      <div class="modal-actions">
        <button class="btn btn-text" id="confirm-cancel">CANCEL</button>
        <button class="btn btn-primary" id="confirm-ok">OK</button>
      </div>
    </div>
  </div>

  <!-- Templates ------------------------------------------------------------ -->

  <template id="tpl-welcome">
    <main class="screen welcome">
      <div class="topo"></div>
      <header class="welcome-hero">
        <h1 class="wordmark">RUCK<span>OPS</span></h1>
        <p class="tagline">BUILT FOR RUCKERS</p>
      </header>
      <section class="auth-block">
        <p class="muted small">No accounts in this build — your data lives on this device.</p>
        <button class="btn btn-primary" id="welcome-continue">GET STARTED</button>
      </section>
      <footer class="welcome-footer">
        <span class="muted small">v0.1 · web MVP</span>
      </footer>
    </main>
  </template>

  <template id="tpl-onboarding">
    <main class="screen onboarding">
      <div class="step-dots" data-step="1">
        <span></span><span></span><span></span><span></span>
      </div>
      <section class="ob-step" data-step="1">
        <h2 class="title">CHOOSE YOUR UNITS</h2>
        <div class="card-row">
          <button class="ob-card selected" data-units="imperial">
            <span class="big">MI · LBS</span>
            <span class="sub">Imperial</span>
          </button>
          <button class="ob-card" data-units="metric">
            <span class="big">KM · KG</span>
            <span class="sub">Metric</span>
          </button>
        </div>
        <button class="btn btn-primary ob-next" data-next="2">NEXT</button>
      </section>
      <section class="ob-step hidden" data-step="2">
        <h2 class="title">BODY WEIGHT (OPTIONAL)</h2>
        <p class="muted">Used for calorie estimates. Skip if you'd rather not.</p>
        <div class="num-input">
          <input type="number" min="0" max="500" id="ob-bodyweight" inputmode="decimal" />
          <span class="suffix" data-unit="weight">LBS</span>
        </div>
        <div class="row">
          <button class="btn btn-text ob-skip" data-next="3">SKIP</button>
          <button class="btn btn-primary ob-next" data-next="3">NEXT</button>
        </div>
      </section>
      <section class="ob-step hidden" data-step="3">
        <h2 class="title">DEFAULT PACK WEIGHT</h2>
        <p class="muted">Saves time on every ruck. You can change it per workout.</p>
        <div class="num-input">
          <input type="number" min="0" max="200" id="ob-packweight" value="35" inputmode="decimal" />
          <span class="suffix" data-unit="weight">LBS</span>
        </div>
        <button class="btn btn-primary ob-next" data-next="4">NEXT</button>
      </section>
      <section class="ob-step hidden" data-step="4">
        <h2 class="title">PERMISSIONS</h2>
        <div class="perm-card">
          <h3>LOCATION</h3>
          <p class="muted">RuckOps tracks your route while a workout is running. Required to record distance and pace.</p>
          <p class="muted small">Web build: only works while this tab is in the foreground. Keep the screen on.</p>
          <button class="btn btn-outline" id="ob-perm-location">ALLOW LOCATION</button>
          <span class="perm-status" id="ob-perm-status"></span>
        </div>
        <button class="btn btn-primary" id="ob-finish">CONTINUE TO DASHBOARD</button>
      </section>
    </main>
  </template>

  <template id="tpl-home">
    <main class="screen home">
      <header class="status-bar">
        <span class="brand">RUCKOPS</span>
        <span class="muted" id="home-date"></span>
      </header>
      <div class="perm-banner hidden" id="perm-banner">
        Location permission needed — tap to fix.
      </div>

      <!-- Calibration prompt — only visible when profile uncalibrated -->
      <div class="calibration-card hidden" id="calibration-card">
        <div class="calibration-content">
          <span class="cal-title">UNLOCK PERSONALIZED COACHING</span>
          <span class="cal-sub">A guided 12-minute calibration tunes every interval mode to your real fitness. Skip-able anytime.</span>
        </div>
        <div class="calibration-actions">
          <button class="btn btn-text" id="cal-skip">SKIP</button>
          <button class="btn btn-primary" id="cal-start">START</button>
        </div>
      </div>

      <!-- Readiness + workout-of-the-day -->
      <section class="readiness-card" id="readiness-card">
        <div class="readiness-row">
          <span class="readiness-label">READINESS</span>
          <span class="readiness-value" id="readiness-value">—</span>
        </div>
        <p class="readiness-detail muted small" id="readiness-detail">Complete a few workouts to see your training load.</p>
      </section>

      <!-- Recommended workout — the WOD. Renders as a hero card with a
           ONE-TAP ACCEPT button, plus a small "freestyle" link for full
           custom flow. Updated by renderHome based on profile + history. -->
      <button class="wod-card" id="start-workout">
        <span class="wod-tag" id="wod-tag">TODAY</span>
        <span class="wod-label" id="wod-label">START WORKOUT</span>
        <span class="wod-sub" id="wod-sub">Tap to begin</span>
        <span class="wod-action" id="wod-action">START →</span>
      </button>
      <button class="link-btn freestyle-btn" id="freestyle-link">or freestyle (custom workout) →</button>

      <section class="panel compact-panel">
        <div class="panel-row">
          <h3 class="panel-title">THIS WEEK</h3>
          <button class="link-btn" id="link-history">History →</button>
        </div>
        <div class="stat-row" id="week-stats">
          <div class="stat"><span class="stat-label">DISTANCE</span><span class="stat-val" data-week="distance">0</span></div>
          <div class="stat"><span class="stat-label">TIME</span><span class="stat-val" data-week="time">0:00</span></div>
          <div class="stat"><span class="stat-label">SESSIONS</span><span class="stat-val" data-week="count">0</span></div>
        </div>
      </section>

      <nav class="tabbar">
        <a href="#/home" class="tab active">HOME</a>
        <a href="#/history" class="tab">HISTORY</a>
        <a href="#/profile" class="tab">PROFILE</a>
      </nav>
    </main>
  </template>

  <!-- Calibration session screen -->
  <template id="tpl-calibration">
    <main class="screen calibration">
      <header class="screen-header">
        <button class="back" data-route="#/home" aria-label="Back">←</button>
        <h2>CALIBRATION</h2>
      </header>

      <!-- Phase indicator at top — visible always -->
      <div class="cal-phase-card">
        <span class="cal-phase-label" id="cal-phase-label">WARMUP</span>
        <span class="cal-phase-step" id="cal-phase-step">Step 1 of 3</span>
      </div>

      <!-- Hero metric: phase-specific (time or distance) -->
      <div class="hero-metric">
        <span class="hero-num" id="cal-hero">5:00</span>
        <span class="hero-label" id="cal-hero-label">LEFT</span>
      </div>

      <div class="sub-metrics">
        <div class="sub-stat"><span class="label">DISTANCE</span><span class="val" id="cal-distance">0.00</span></div>
        <div class="sub-stat"><span class="label">DURATION</span><span class="val" id="cal-duration">0:00</span></div>
        <div class="sub-stat"><span class="label">PACE</span><span class="val" id="cal-pace">--:--</span></div>
      </div>

      <p class="cal-instruction" id="cal-instruction">
        Warm up at a comfortable easy pace. Don't push — this is just to get your legs moving.
      </p>

      <div class="live-controls">
        <button class="btn btn-outline btn-large" id="cal-skip-phase">SKIP PHASE</button>
        <button class="btn btn-danger btn-large" id="cal-abort">ABORT</button>
      </div>

      <!-- Pre-start sheet: shown before warmup begins -->
      <div class="sheet" id="sheet-cal-intro" aria-hidden="false">
        <div class="sheet-backdrop"></div>
        <div class="sheet-card">
          <div class="sheet-handle"></div>
          <header class="sheet-header"><h3>BEFORE YOU START</h3></header>
          <div class="sheet-body">
            <p>This 12-minute calibration session gives the app what it needs to personalize every workout to your real fitness.</p>
            <p><strong>What you'll do:</strong></p>
            <ul class="cal-steps">
              <li><strong>5 min warmup</strong> — easy jog, get loose</li>
              <li><strong>1 mile time trial</strong> — push as hard as you can sustain for one mile</li>
              <li><strong>5 min cooldown</strong> — easy jog</li>
            </ul>
            <p><strong>What you need:</strong></p>
            <ul class="cal-steps">
              <li>A flat, open route with clear GPS sky</li>
              <li>About 15 minutes</li>
              <li>Hydration nearby</li>
            </ul>
            <p class="muted small">After this, every interval mode (Norwegian 4×4, Galloway, etc.) will automatically suggest paces tuned to you.</p>
            <button class="btn btn-primary btn-large" id="cal-begin">I'M READY · START WARMUP</button>
            <button class="btn btn-text" id="cal-cancel">NOT NOW</button>
          </div>
        </div>
      </div>

      <!-- Post-trial results sheet -->
      <div class="sheet hidden" id="sheet-cal-results" aria-hidden="true">
        <div class="sheet-backdrop"></div>
        <div class="sheet-card">
          <div class="sheet-handle"></div>
          <header class="sheet-header"><h3>CALIBRATION COMPLETE</h3></header>
          <div class="sheet-body">
            <p class="cal-result-headline" id="cal-result-headline">Your 1-mile pace: --:--</p>
            <div class="storage-stats" id="cal-derived">
              <div class="row"><span class="label">vVO₂max pace</span><span class="val" id="cal-vvo2"></span></div>
              <div class="row"><span class="label">Threshold pace</span><span class="val" id="cal-threshold"></span></div>
              <div class="row"><span class="label">Easy pace</span><span class="val" id="cal-easy"></span></div>
              <div class="row"><span class="label">Marathon pace</span><span class="val" id="cal-marathon"></span></div>
            </div>
            <p class="muted small">These paces are now used as defaults across every interval mode. You can override them per workout. We'll keep refining as you log more sessions.</p>
            <button class="btn btn-primary btn-large" id="cal-save">SAVE & RETURN</button>
            <button class="btn btn-text danger" id="cal-redo">REDO CALIBRATION</button>
          </div>
        </div>
      </div>
    </main>
  </template>

  <template id="tpl-pre">
    <main class="screen pre tile-screen">
      <header class="screen-header">
        <button class="back" data-route="#/home" aria-label="Back">←</button>
        <h2>NEW WORKOUT</h2>
      </header>

      <div class="tile-grid">
        <button class="tile" data-sheet="mode">
          <span class="tile-label">MODE</span>
          <span class="tile-value" id="tile-mode-val">RUCK</span>
        </button>
        <button class="tile" data-sheet="pack" id="tile-pack">
          <span class="tile-label">PACK</span>
          <span class="tile-value" id="tile-pack-val">35 LBS</span>
        </button>
      </div>

      <button class="tile tile-wide" data-sheet="pacing">
        <span class="tile-label">PACING</span>
        <span class="tile-value" id="tile-pacing-val">Off · steady</span>
        <span class="tile-detail" id="tile-pacing-detail"></span>
      </button>

      <button class="tile tile-wide" data-sheet="goal">
        <span class="tile-label">GOAL</span>
        <span class="tile-value" id="tile-goal-val">None</span>
        <span class="tile-detail" id="tile-goal-detail"></span>
      </button>

      <button class="tile tile-wide" data-sheet="coaching">
        <span class="tile-label">COACHING</span>
        <span class="tile-value" id="tile-coaching-val">Full voice · 10s anticip</span>
      </button>

      <button class="tile tile-wide" data-sheet="hr" id="tile-hr-btn">
        <span class="tile-label">HEART RATE</span>
        <span class="tile-value" id="tile-hr-val">Not paired</span>
        <span class="tile-detail" id="tile-hr-detail">Pair a Bluetooth strap for zone-based coaching</span>
      </button>

      <div class="gps-line">
        <span class="gps-chip" id="gps-status">📡 SEARCHING</span>
        <span class="injury-pill hidden" id="injury-pill"></span>
      </div>

      <button class="btn btn-primary big-cta" id="begin-tracking" disabled>START</button>

      <!-- ========== HIDDEN STATE (controls live inside sheets) ========== -->
      <!-- Mode sheet -->
      <div class="sheet hidden" id="sheet-mode" aria-hidden="true">
        <div class="sheet-backdrop"></div>
        <div class="sheet-card">
          <div class="sheet-handle"></div>
          <header class="sheet-header"><h3>MODE</h3><button class="sheet-close">DONE</button></header>
          <div class="sheet-body">
            <div class="mode-toggle">
              <button class="mode selected" data-mode="ruck">RUCK</button>
              <button class="mode" data-mode="run">RUN</button>
            </div>
            <p class="muted small mode-help">Ruck adds a pack weight stat and adjusts fuel/hydration cues. Run tracks pace only.</p>
          </div>
        </div>
      </div>

      <!-- Pack sheet -->
      <div class="sheet hidden" id="sheet-pack" aria-hidden="true">
        <div class="sheet-backdrop"></div>
        <div class="sheet-card">
          <div class="sheet-handle"></div>
          <header class="sheet-header"><h3>PACK WEIGHT</h3><button class="sheet-close">DONE</button></header>
          <div class="sheet-body">
            <div class="stepper">
              <button class="stepper-btn" id="pack-minus" aria-label="Decrease pack weight">−</button>
              <div class="stepper-display">
                <input type="number" min="0" max="200" id="pre-packweight" inputmode="decimal" />
                <span class="suffix" data-unit="weight">LBS</span>
              </div>
              <button class="stepper-btn" id="pack-plus" aria-label="Increase pack weight">+</button>
            </div>
            <p class="muted small">Steps of 5 lbs (or 2 kg). Reference: 35 lbs is the standard rucking weight; over 50 lbs is heavy; over 65 lbs the app recommends march-only.</p>
          </div>
        </div>
      </div>

      <!-- Pacing sheet -->
      <div class="sheet hidden" id="sheet-pacing" aria-hidden="true">
        <div class="sheet-backdrop"></div>
        <div class="sheet-card">
          <div class="sheet-handle"></div>
          <header class="sheet-header"><h3>PACING</h3><button class="sheet-close">DONE</button></header>
          <div class="sheet-body">
            <div class="muted small section-sublabel">PACE-DRIVEN</div>
            <div class="pacing-options">
              <button class="pacing-opt selected" data-pacing="off">
                <span class="opt-label">OFF</span>
                <span class="opt-sub">steady, no intervals</span>
              </button>
              <button class="pacing-opt" data-pacing="galloway">
                <span class="opt-label">GALLOWAY RUN-WALK</span>
                <span class="opt-sub">evidence-based · reduces injury risk ~50%</span>
              </button>
              <button class="pacing-opt" data-pacing="tactical">
                <span class="opt-label">TACTICAL RUCK SHUFFLE</span>
                <span class="opt-sub">military protocol · scales with pack weight</span>
              </button>
              <button class="pacing-opt" data-pacing="custom">
                <span class="opt-label">CUSTOM</span>
                <span class="opt-sub">set your own intervals</span>
              </button>
            </div>
            <div class="muted small section-sublabel">EFFORT-DRIVEN <span class="muted">(structured workouts)</span></div>
            <div class="pacing-options">
              <button class="pacing-opt" data-pacing="norwegian">
                <span class="opt-label">NORWEGIAN 4×4</span>
                <span class="opt-sub">4×(4m work / 3m easy) · gold-standard VO₂ max · 28 min</span>
              </button>
              <button class="pacing-opt" data-pacing="pyramid">
                <span class="opt-label">PYRAMID 1-2-3-2-1</span>
                <span class="opt-sub">ladder intervals · 18 min</span>
              </button>
              <button class="pacing-opt" data-pacing="fartlek">
                <span class="opt-label">FARTLEK</span>
                <span class="opt-sub">random surges · &quot;speed play&quot; · continuous</span>
              </button>
            </div>
            <div class="pace-config hidden" id="pace-config">
              <label class="muted small" id="pace-label">AVERAGE TARGET PACE</label>
              <div class="stepper">
                <button class="stepper-btn" id="pace-minus" aria-label="Slower">−</button>
                <div class="stepper-display">
                  <span class="pace-value" id="pace-value">9:00</span>
                  <span class="suffix" data-unit="pace">/MI</span>
                </div>
                <button class="stepper-btn" id="pace-plus" aria-label="Faster">+</button>
              </div>
              <p class="pace-derived" id="pace-derived"></p>
            </div>
            <div class="custom-config hidden" id="custom-config">
              <div class="stepper-row">
                <label class="muted small">RUN</label>
                <div class="stepper">
                  <button class="stepper-btn small" id="run-minus" aria-label="Less run">−</button>
                  <div class="stepper-display small"><span id="run-val">4:00</span></div>
                  <button class="stepper-btn small" id="run-plus" aria-label="More run">+</button>
                </div>
              </div>
              <div class="stepper-row">
                <label class="muted small">WALK</label>
                <div class="stepper">
                  <button class="stepper-btn small" id="walk-minus" aria-label="Less walk">−</button>
                  <div class="stepper-display small"><span id="walk-val">1:00</span></div>
                  <button class="stepper-btn small" id="walk-plus" aria-label="More walk">+</button>
                </div>
              </div>
            </div>
            <p class="injury-warning hidden" id="injury-warning"></p>
          </div>
        </div>
      </div>

      <!-- Goal sheet -->
      <div class="sheet hidden" id="sheet-goal" aria-hidden="true">
        <div class="sheet-backdrop"></div>
        <div class="sheet-card">
          <div class="sheet-handle"></div>
          <header class="sheet-header"><h3>GOAL</h3><button class="sheet-close">DONE</button></header>
          <div class="sheet-body">
            <div class="goal-options">
              <button class="goal-opt selected" data-goal="none">NONE</button>
              <button class="goal-opt" data-goal="distance">DISTANCE</button>
              <button class="goal-opt" data-goal="time">TIME</button>
            </div>
            <div class="goal-config hidden" id="goal-config">
              <div class="stepper">
                <button class="stepper-btn" id="goal-minus" aria-label="Decrease">−</button>
                <div class="stepper-display">
                  <span class="goal-value" id="goal-value">3.0</span>
                  <span class="suffix" id="goal-suffix" data-unit="distance">MI</span>
                </div>
                <button class="stepper-btn" id="goal-plus" aria-label="Increase">+</button>
              </div>
              <p class="goal-eta" id="goal-eta"></p>
              <!-- Goal-reached behavior: continue tracking or auto-end. -->
              <div class="goal-behavior-row">
                <span class="muted small">WHEN GOAL IS REACHED</span>
                <div class="goal-behavior-options">
                  <button class="goal-behavior-opt selected" data-behavior="continue">KEEP GOING</button>
                  <button class="goal-behavior-opt" data-behavior="stop_at_goal">AUTO-END</button>
                </div>
                <p class="muted tiny" id="goal-behavior-hint">Track cooldown after hitting the goal.</p>
              </div>
              <div class="fuel-plan-preview hidden" id="fuel-plan-preview">
                <div class="row"><span class="label">Hydration</span><span class="val" id="fuel-plan-water"></span></div>
                <div class="row"><span class="label">Fuel</span><span class="val" id="fuel-plan-carbs"></span></div>
                <p class="notes" id="fuel-plan-notes"></p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Coaching sheet -->
      <div class="sheet hidden" id="sheet-coaching" aria-hidden="true">
        <div class="sheet-backdrop"></div>
        <div class="sheet-card">
          <div class="sheet-handle"></div>
          <header class="sheet-header"><h3>COACHING</h3><button class="sheet-close">DONE</button></header>
          <div class="sheet-body">
            <div class="setting-row">
              <span class="muted">VOICE CUES</span>
              <select id="pre-set-voice">
                <option value="off">OFF</option>
                <option value="minimal">MINIMAL · phase changes only</option>
                <option value="full">FULL · + mile/km splits + fuel</option>
                <option value="verbose">VERBOSE · + pace updates every 2 min</option>
              </select>
            </div>
            <div class="setting-row">
              <span class="muted">SOUND EFFECTS</span>
              <label class="toggle"><input type="checkbox" id="pre-set-sounds" /><span></span></label>
            </div>
            <div class="setting-row">
              <span class="muted">ANTICIPATION</span>
              <select id="pre-set-anticipation">
                <option value="0">OFF</option>
                <option value="5">5 sec warning</option>
                <option value="10">10 sec warning</option>
                <option value="15">15 sec warning</option>
              </select>
            </div>
            <button class="btn btn-outline" id="pre-test-sound">🔊 TEST SOUND</button>
            <p class="muted small">If you don't hear anything: check your phone isn't on silent (iPhone hardware switch), volume is up, and the browser tab isn't muted.</p>
          </div>
        </div>
      </div>

      <!-- HR sheet — pair Bluetooth strap, optionally set HRmax/HRrest -->
      <div class="sheet hidden" id="sheet-hr" aria-hidden="true">
        <div class="sheet-backdrop"></div>
        <div class="sheet-card">
          <div class="sheet-handle"></div>
          <header class="sheet-header"><h3>HEART RATE</h3><button class="sheet-close">DONE</button></header>
          <div class="sheet-body">
            <div id="hr-status-area">
              <p class="muted small" id="hr-supported-msg">Pair a Bluetooth heart-rate strap (Polar H10, Wahoo TICKR, Garmin HRM-Dual, etc.) to unlock zone-based coaching for every interval mode.</p>
              <button class="btn btn-primary btn-large" id="hr-pair-btn">PAIR HR STRAP</button>
              <button class="btn btn-outline hidden" id="hr-disconnect-btn">DISCONNECT</button>
            </div>
            <div class="storage-stats">
              <div class="row"><span class="label">Status</span><span class="val" id="hr-status">Not paired</span></div>
              <div class="row"><span class="label">Current</span><span class="val" id="hr-current">—</span></div>
              <div class="row"><span class="label">Zone</span><span class="val" id="hr-zone">—</span></div>
            </div>
            <div class="setting-row">
              <span class="muted">HRMAX (BPM)</span>
              <div class="num-input small">
                <input type="number" min="120" max="220" id="hr-max-input" inputmode="numeric" />
                <span class="suffix">BPM</span>
              </div>
            </div>
            <div class="setting-row">
              <span class="muted">HRREST (BPM)</span>
              <div class="num-input small">
                <input type="number" min="30" max="100" id="hr-rest-input" inputmode="numeric" />
                <span class="suffix">BPM</span>
              </div>
            </div>
            <p class="muted small">HRmax: highest BPM seen in a hard effort. Defaults to 208 − 0.7·age if your age is set. HRrest: morning BPM before getting out of bed. These define your training zones.</p>
          </div>
        </div>
      </div>
    </main>
  </template>

  <template id="tpl-live">
    <main class="screen live">
      <header class="live-header">
        <span class="gps-chip" id="live-gps-chip">📡 SEARCHING</span>
        <span class="hr-chip hidden" id="live-hr-chip"></span>
        <span class="hr-chip cadence hidden" id="live-cadence-chip"></span>
        <span class="hr-chip dr-active hidden" id="live-dr-chip">📍 PDR</span>
        <button class="icon-btn" id="live-lock" title="Lock screen" aria-label="Lock screen">🔒</button>
      </header>
      <div class="fuel-alert hidden" id="fuel-alert">
        <div class="fuel-alert-text">
          <span class="fuel-alert-title" id="fuel-alert-title">HYDRATE</span>
          <span class="fuel-alert-detail" id="fuel-alert-detail">6–8 oz · 180–240 ml</span>
        </div>
        <div class="fuel-alert-actions">
          <button class="btn btn-text" id="fuel-skip">SKIP</button>
          <button class="btn btn-primary" id="fuel-done">DONE</button>
        </div>
      </div>
      <div class="pacing-banner hidden" id="pacing-banner">
        <div class="pacing-banner-row">
          <span class="pacing-phase" id="pacing-phase">RUN</span>
          <span class="pacing-remaining" id="pacing-remaining">--</span>
        </div>
        <div class="pacing-banner-row paces">
          <span class="pacing-target" id="pacing-target">target --:--</span>
          <span class="pacing-current" id="pacing-current">current --:--</span>
        </div>
      </div>
      <div class="goal-progress hidden" id="goal-progress">
        <div class="goal-progress-bar"><div class="goal-progress-fill" id="goal-progress-fill"></div></div>
        <div class="goal-progress-label">
          <span id="goal-progress-current">0</span>
          <span class="goal-status-chip" id="goal-status-chip"></span>
          <span id="goal-progress-target">0</span>
        </div>
        <p class="required-pace-hint hidden" id="required-pace-hint"></p>
      </div>
      <div class="hero-metric">
        <span class="hero-num" id="live-distance">0.00</span>
        <span class="hero-unit" data-unit="distance">MI</span>
        <span class="hero-label">DISTANCE</span>
      </div>
      <div class="sub-metrics">
        <div class="sub-stat"><span class="label">DURATION</span><span class="val" id="live-duration">00:00</span></div>
        <div class="sub-stat"><span class="label">PACE</span><span class="val" id="live-pace">--:--</span></div>
        <div class="sub-stat"><span class="label">AVG</span><span class="val" id="live-avg-pace">--:--</span></div>
        <div class="sub-stat" id="live-pack-stat"><span class="label">PACK</span><span class="val" id="live-pack">--</span></div>
        <div class="sub-stat hidden" id="live-gap-stat" title="Grade-adjusted pace (Minetti)"><span class="label">GAP</span><span class="val" id="live-gap">--:--</span></div>
        <div class="sub-stat hidden" id="live-elev-stat"><span class="label">ASCENT</span><span class="val" id="live-elev">0</span></div>
      </div>
      <div class="live-controls">
        <button class="btn btn-outline btn-large" id="live-pause">PAUSE</button>
        <button class="btn btn-danger btn-large" id="live-end">END</button>
      </div>
      <div class="paused-overlay hidden" id="paused-overlay">
        <span class="paused-label">PAUSED</span>
        <button class="btn btn-primary btn-large" id="live-resume">RESUME</button>
      </div>
      <div class="lock-overlay hidden" id="lock-overlay">
        <span class="lock-label">SCREEN LOCKED</span>
        <span class="muted small">Double-tap anywhere to unlock</span>
      </div>
    </main>
  </template>

  <template id="tpl-summary">
    <main class="screen summary">
      <header class="screen-header">
        <h2>WORKOUT COMPLETE</h2>
      </header>
      <div class="summary-stats" id="summary-stats"></div>

      <!-- RPE: subjective effort rating. Required for training load tracking
           on phones without HR. Mapped to the Borg CR-10 scale. Tap once. -->
      <section class="panel compact-panel">
        <h3 class="panel-title">HOW HARD?</h3>
        <p class="muted small" id="rpe-help">Rate the effort. This sharpens the load tracking on your home screen.</p>
        <div class="rpe-picker" id="rpe-picker">
          <button class="rpe-btn" data-rpe="2"><span>2</span><span class="rpe-sub">EASY</span></button>
          <button class="rpe-btn" data-rpe="4"><span>4</span><span class="rpe-sub">LIGHT</span></button>
          <button class="rpe-btn" data-rpe="6"><span>6</span><span class="rpe-sub">MOD</span></button>
          <button class="rpe-btn" data-rpe="8"><span>8</span><span class="rpe-sub">HARD</span></button>
          <button class="rpe-btn" data-rpe="10"><span>10</span><span class="rpe-sub">MAX</span></button>
        </div>
      </section>

      <div class="map-wrap" id="summary-map"></div>
      <label class="muted small">NOTES</label>
      <textarea id="summary-notes" rows="3" placeholder="optional"></textarea>
      <div class="row">
        <button class="btn btn-text" id="summary-discard">DISCARD</button>
        <button class="btn btn-primary" id="summary-save">SAVE</button>
      </div>
    </main>
  </template>

  <template id="tpl-history">
    <main class="screen history">
      <header class="screen-header"><h2>HISTORY</h2></header>
      <div class="filter-row">
        <button class="filter selected" data-filter="all">ALL</button>
        <button class="filter" data-filter="ruck">RUCK</button>
        <button class="filter" data-filter="run">RUN</button>
      </div>
      <ol class="workout-list" id="history-list"></ol>
      <p class="muted small empty hidden" id="history-empty">No workouts yet. Hit the field.</p>
      <nav class="tabbar">
        <a href="#/home" class="tab">HOME</a>
        <a href="#/history" class="tab active">HISTORY</a>
        <a href="#/profile" class="tab">PROFILE</a>
      </nav>
    </main>
  </template>

  <template id="tpl-detail">
    <main class="screen detail">
      <header class="screen-header">
        <button class="back" data-route="#/history" aria-label="Back">←</button>
        <h2 id="detail-title">WORKOUT</h2>
        <button class="icon-btn header-action" id="detail-delete" aria-label="Delete workout">🗑</button>
      </header>
      <div class="summary-stats" id="detail-stats"></div>
      <div class="map-wrap" id="detail-map"></div>
      <section class="panel">
        <h3 class="panel-title">NOTES</h3>
        <p id="detail-notes" class="notes muted">—</p>
      </section>
    </main>
  </template>

  <template id="tpl-profile">
    <main class="screen profile tile-screen">
      <header class="screen-header"><h2>PROFILE</h2></header>

      <div class="tile-grid">
        <button class="tile" data-sheet="p-units">
          <span class="tile-label">UNITS</span>
          <span class="tile-value" id="tile-units-val">MI · LBS</span>
        </button>
        <button class="tile" data-sheet="p-body">
          <span class="tile-label">BODY</span>
          <span class="tile-value" id="tile-body-val">145 LBS</span>
        </button>
        <button class="tile" data-sheet="p-pack">
          <span class="tile-label">DEFAULT PACK</span>
          <span class="tile-value" id="tile-defpack-val">30 LBS</span>
        </button>
        <button class="tile" data-sheet="p-autopause">
          <span class="tile-label">AUTO-PAUSE</span>
          <span class="tile-value" id="tile-autopause-val">ON</span>
        </button>
      </div>

      <button class="tile tile-wide" data-sheet="p-coaching">
        <span class="tile-label">COACHING</span>
        <span class="tile-value" id="tile-coaching2-val">Full voice · 10s anticip</span>
      </button>

      <button class="tile tile-wide" id="tile-cal" data-route="#/calibration">
        <span class="tile-label">CALIBRATION</span>
        <span class="tile-value" id="tile-cal-val">Not calibrated · tap to run</span>
        <span class="tile-detail" id="tile-cal-detail"></span>
      </button>

      <button class="tile tile-wide" data-sheet="p-storage">
        <span class="tile-label">DATA & BACKUP</span>
        <span class="tile-value" id="tile-storage-val">0 workouts · local only</span>
      </button>

      <p class="muted small version-line">v1.1 · 2026-05-11i · web MVP · <a href="#" id="about-link">about</a></p>

      <nav class="tabbar">
        <a href="#/home" class="tab">HOME</a>
        <a href="#/history" class="tab">HISTORY</a>
        <a href="#/profile" class="tab active">PROFILE</a>
      </nav>

      <!-- Profile sheets -->
      <div class="sheet hidden" id="sheet-p-units">
        <div class="sheet-backdrop"></div>
        <div class="sheet-card">
          <div class="sheet-handle"></div>
          <header class="sheet-header"><h3>UNITS</h3><button class="sheet-close">DONE</button></header>
          <div class="sheet-body">
            <div class="setting-row">
              <span class="muted">MEASUREMENT SYSTEM</span>
              <select id="set-units">
                <option value="imperial">MI · LBS</option>
                <option value="metric">KM · KG</option>
              </select>
            </div>
            <p class="muted small">Distance, weight, pace — all display in your chosen system.</p>
          </div>
        </div>
      </div>

      <div class="sheet hidden" id="sheet-p-body">
        <div class="sheet-backdrop"></div>
        <div class="sheet-card">
          <div class="sheet-handle"></div>
          <header class="sheet-header"><h3>BODY WEIGHT</h3><button class="sheet-close">DONE</button></header>
          <div class="sheet-body">
            <div class="num-input small">
              <input type="number" min="0" max="500" id="set-bodyweight" inputmode="decimal" />
              <span class="suffix" data-unit="weight">LBS</span>
            </div>
            <p class="muted small">Used to flag high pack:body ratios. Never shared.</p>
          </div>
        </div>
      </div>

      <div class="sheet hidden" id="sheet-p-pack">
        <div class="sheet-backdrop"></div>
        <div class="sheet-card">
          <div class="sheet-handle"></div>
          <header class="sheet-header"><h3>DEFAULT PACK</h3><button class="sheet-close">DONE</button></header>
          <div class="sheet-body">
            <div class="num-input small">
              <input type="number" min="0" max="200" id="set-packweight" inputmode="decimal" />
              <span class="suffix" data-unit="weight">LBS</span>
            </div>
            <p class="muted small">Pre-fills the pack weight on new workouts. Per-workout edits don't change this.</p>
          </div>
        </div>
      </div>

      <div class="sheet hidden" id="sheet-p-autopause">
        <div class="sheet-backdrop"></div>
        <div class="sheet-card">
          <div class="sheet-handle"></div>
          <header class="sheet-header"><h3>AUTO-PAUSE</h3><button class="sheet-close">DONE</button></header>
          <div class="sheet-body">
            <div class="setting-row">
              <span class="muted">ENABLED</span>
              <label class="toggle"><input type="checkbox" id="set-autopause" /><span></span></label>
            </div>
            <p class="muted small">Pauses the workout after 15 seconds of stillness. Resumes on movement.</p>
          </div>
        </div>
      </div>

      <div class="sheet hidden" id="sheet-p-coaching">
        <div class="sheet-backdrop"></div>
        <div class="sheet-card">
          <div class="sheet-handle"></div>
          <header class="sheet-header"><h3>COACHING</h3><button class="sheet-close">DONE</button></header>
          <div class="sheet-body">
            <div class="setting-row">
              <span class="muted">VOICE CUES</span>
              <select id="set-voice">
                <option value="off">OFF</option>
                <option value="minimal">MINIMAL · phase changes only</option>
                <option value="full">FULL · + splits + fuel</option>
                <option value="verbose">VERBOSE · + pace updates every 2 min</option>
              </select>
            </div>
            <div class="setting-row">
              <span class="muted">SOUND EFFECTS</span>
              <label class="toggle"><input type="checkbox" id="set-sounds" /><span></span></label>
            </div>
            <div class="setting-row">
              <span class="muted">ANTICIPATION</span>
              <select id="set-anticipation">
                <option value="0">OFF</option>
                <option value="5">5 sec warning</option>
                <option value="10">10 sec warning</option>
                <option value="15">15 sec warning</option>
              </select>
            </div>
            <button class="btn btn-outline" id="profile-test-sound">🔊 TEST SOUND</button>
            <p class="muted small">If you hear nothing: check your phone isn't on silent (iPhone hardware switch), volume is up, and the browser tab isn't muted.</p>
          </div>
        </div>
      </div>

      <div class="sheet hidden" id="sheet-p-storage">
        <div class="sheet-backdrop"></div>
        <div class="sheet-card">
          <div class="sheet-handle"></div>
          <header class="sheet-header"><h3>DATA & BACKUP</h3><button class="sheet-close">DONE</button></header>
          <div class="sheet-body">
            <div class="storage-stats" id="storage-stats">
              <div class="row"><span class="label">Workouts</span><span class="val" id="storage-count">0</span></div>
              <div class="row"><span class="label">Local storage</span><span class="val" id="storage-size">—</span></div>
              <div class="row"><span class="label">Persistence</span><span class="val" id="storage-persist">Unknown</span></div>
            </div>
            <button class="btn btn-outline" id="request-persist">REQUEST PERSISTENT STORAGE</button>
            <button class="btn btn-outline" id="backup-json">BACKUP (JSON)</button>
            <button class="btn btn-outline" id="restore-json">RESTORE (JSON)</button>
            <input type="file" id="restore-file" accept="application/json,.json" style="display:none" />
            <button class="btn btn-outline" id="export-csv">EXPORT CSV</button>
            <button class="btn btn-outline" id="force-update">FORCE UPDATE</button>
            <button class="btn btn-text danger" id="reset-app">RESET ALL DATA</button>
            <p class="muted small">Workouts are stored in your browser's localStorage. Request persistent storage to make the browser less likely to evict it under disk pressure. Use backup/restore to move data between devices.</p>
          </div>
        </div>
      </div>
    </main>
  </template>
  </template>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js?v=20260511i" type="module"></script>
</body>
</html>
